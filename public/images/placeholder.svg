<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Product photograph coming soon">
  <!--
    Temporary stand-in for every product and collection photograph.

    An SVG rather than another PNG: it is under 2 KB, scales to any size
    without a second file, and cannot quietly reintroduce the image weight
    problem that Phase 1 just fixed.

    Colours are taken from the site's own warm palette so the layout still
    reads correctly while the real photography is being decided.

    No caption text. An earlier version said "Photograph coming soon", which
    was fine on a product card but scaled to enormous when the same file was
    used as the full-bleed hero background, colliding with the hero copy. The
    box glyph alone says "image goes here" at every size, and a placeholder
    should never compete with real content for attention.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3b30" />
      <stop offset="100%" stop-color="#33281f" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />

  <!-- Inset keyline, echoing the site's boxed, gift-like framing. -->
  <rect x="48" y="48" width="704" height="704" fill="none"
        stroke="#c9a06a" stroke-opacity="0.30" stroke-width="2" />

  <!-- A simple box glyph: recognisable as "a product goes here". -->
  <g stroke="#d3a877" stroke-opacity="0.45" stroke-width="6" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M400 250 L560 330 L560 500 L400 580 L240 500 L240 330 Z" />
    <path d="M240 330 L400 410 L560 330" />
    <path d="M400 410 L400 580" />
  </g>

</svg>
